<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#1b1f24"/>
      <stop offset="1" stop-color="#050607"/>
    </radialGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3137"/>
      <stop offset="1" stop-color="#0d0f12"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- the hood -->
  <path d="M10 60 C10 36 18 12 32 9 C46 12 54 36 54 60 Z" fill="url(#hood)"/>
  <path d="M32 9 C46 12 54 36 54 60" fill="none" stroke="#9fb0bb" stroke-opacity="0.35" stroke-width="1.2"/>
  <!-- the dark inside the hood -->
  <ellipse cx="32" cy="35" rx="13" ry="15" fill="#030405"/>
  <!-- the eyes -->
  <g filter="url(#glow)" fill="#f2f8fb">
    <ellipse cx="26.5" cy="34" rx="3.4" ry="2.5"/>
    <ellipse cx="37.5" cy="34" rx="3.4" ry="2.5"/>
  </g>
</svg>
